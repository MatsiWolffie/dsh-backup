name: 功能建议 / Feature request
description: 提出备份、恢复、离线程序或使用体验上的改进建议。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        > 请不要在 Issue 中粘贴凭据、会话内容或还原点数据。
        > 安全相关问题请走私密报告。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 描述当前的不便或风险，而不是直接给实现方案。
      placeholder: 每次 DSH 更新后，我需要 ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
      description: 可以是交互、备份策略、恢复流程、离线程序等。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 相关范围
      options:
        - 备份
        - 应用内恢复
        - 离线恢复
        - 插件卡片 / UI
        - 安装与升级
        - 文档
        - 其他
    validations:
      required: true

  - type: input
    id: dsh_version
    attributes:
      label: 当前 DSH 版本（可选）
      placeholder: 0.2.2-rc.5

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我没有在内容中包含凭据、会话、附件或还原点数据。
          required: true
