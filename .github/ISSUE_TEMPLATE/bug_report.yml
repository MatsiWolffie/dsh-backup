name: 故障报告 / Bug report
description: 报告备份、恢复、离线恢复、插件崩溃或数据异常。请先阅读故障排查。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        > **不要上传** `.credentials.yaml`、会话内容、附件、完整还原点或其他隐私数据。
        > 安全漏洞请走仓库 Security 页的私密报告，不要开公开 Issue。
        > 提交前请先看 README 的「故障排查」。

  - type: input
    id: dsh_version
    attributes:
      label: DSH 版本
      description: 例如 0.2.2-rc.5、0.2.3。可在 DSH 关于页或安装信息中查看。
      placeholder: 0.2.2-rc.5
    validations:
      required: true

  - type: input
    id: plugin_version
    attributes:
      label: 插件版本
      description: 例如 v1.0.1；请填写实际安装的版本，不要写 latest。
      placeholder: v1.0.1
    validations:
      required: true

  - type: dropdown
    id: after_update
    attributes:
      label: 是否在最近一次 DSH 或插件更新后出现？
      description: DSH 更新后插件崩溃是常见情况，请尽量确认。
      options:
        - 是，更新 DSH 后出现
        - 是，更新插件后出现
        - 否，一直存在
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 10
        - Windows 11
        - macOS
        - Linux
        - 其他
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 问题类型
      options:
        - 备份失败或备份不完整
        - 应用内恢复失败
        - 离线恢复（恢复DSH.cmd / restore.ps1）失败
        - 插件崩溃 / DSH 无法启动
        - 卡片或按钮异常（403/404/405、无响应）
        - 数据丢失、覆盖或回滚异常
        - 安装 / 升级问题
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开 DSH 开始，写清每一步。能稳定复现最好。
      placeholder: |
        1. 打开 DSH ...
        2. 点击 ...
        3. 看到 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 包括错误提示、HTTP 状态码、是否弹窗、是否卡死等。
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志与错误信息（已脱敏）
      description: 可粘贴 DSH 控制台、浏览器 Console、`%USERPROFILE%\.dsh\.dsh-backup\last-restore.json` 的相关片段；请删除 openid、路径中的用户名、凭据、会话内容。
      render: shell
    validations:
      required: false

  - type: input
    id: point
    attributes:
      label: 相关还原点名称（可选）
      description: 例如 20261124-182922；不要上传整个还原点。
      placeholder: 20261124-182922

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认没有上传 `.credentials.yaml`、会话内容、附件、完整还原点或其他隐私数据。
          required: true
        - label: 我理解 Issue 是公开的，并已删除日志中的用户名、路径和凭据。
          required: true
