name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check index.js
      - run: node --check client.js
      - run: node --check lib/engine.js
      - run: node test/log.test.mjs
      - run: node test/engine.test.mjs
      - run: node test/tool.test.mjs
